name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.wrangler' \
            --exclude='.img2threejs' \
            --exclude='worker' \
            --exclude='scripts' \
            --exclude='node_modules' \
            --exclude='serve.sh' \
            --exclude='wrangler.jsonc' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.assetsignore' \
            --exclude='procedural-fisherman.html' \
            --exclude='fisherman.png' \
            --exclude='_site' \
            ./ _site/
          touch _site/.nojekyll

      # 次世代グラフィックのフォークを /nextgen/ に並べて置く（本番のトップは main のまま）
      - name: Checkout nextgen fork
        uses: actions/checkout@v4
        with:
          ref: fork/nextgen-graphics
          path: _nextgen

      - name: Add nextgen fork under /nextgen/
        run: |
          mkdir -p _site/nextgen
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='worker' \
            --exclude='scripts' \
            --exclude='docs' \
            --exclude='lab' \
            --exclude='node_modules' \
            --exclude='serve.sh' \
            --exclude='wrangler.jsonc' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.assetsignore' \
            _nextgen/ _site/nextgen/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
