<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab: underwater + weatherfx</title>
<!-- 相対 URL（assets/…・importmap）をリポジトリの根から解決する -->
<base href="../">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lab/_kit/lab.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="lab-status">lab: loading</div>
<script type="module">
/* underwater（§6.3）と weatherfx（§6.9）の lab（CORE_API §16）。
   統合済みの sky・water・terrain・trees と、この 2 つを本物で動かす（残りは core のスタブ）。
   ?only=1 で underwater と weatherfx だけを本物にする（他はスタブ。切り分け用） */
import { bootLabPage } from './lab/_kit/page.js';
const only = new URLSearchParams(location.search).get('only') === '1';
bootLabPage({ modules: only ? ['underwater', 'weatherfx'] : ['sky', 'water', 'underwater', 'terrain', 'trees', 'weatherfx'] });
</script>
</body>
</html>
