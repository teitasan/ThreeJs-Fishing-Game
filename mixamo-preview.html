<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mixamo モーション確認 — 湖畔のフィッシング</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<style>
:root { --bg:#131a1e; --panel:#1b252a; --line:#31424a; --fg:#dfe8ea; --dim:#8fa3ab; --gold:#f5c451; --bad:#ff6b6b; --good:#6de08a; }
* { box-sizing: border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); overflow:hidden; display:flex;
  font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif; font-size:13px; }
#view { flex:1; min-width:0; position:relative; }
#view canvas { display:block; width:100%; height:100%; }
#side { width:290px; background:var(--panel); border-left:1px solid var(--line);
  padding:14px; overflow-y:auto; }
h1 { font-size:14px; margin:0 0 12px; color:var(--gold); }
.row { margin-bottom:10px; }
label { display:block; color:var(--dim); font-size:11.5px; margin-bottom:3px; }
input[type=range] { width:100%; }
select, button { width:100%; background:#223037; color:var(--fg); border:1px solid var(--line);
  border-radius:5px; padding:6px 8px; font:inherit; }
button { cursor:pointer; }
button:hover { background:#2b3d46; }
.chk { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12px; margin-bottom:7px; }
#readout { position:absolute; left:12px; top:12px; background:rgba(10,16,20,.72); padding:9px 13px;
  border-radius:6px; font-size:11.5px; line-height:1.9; font-variant-numeric:tabular-nums; }
#readout b { color:var(--gold); font-weight:600; }
.warn { color:var(--bad); } .ok { color:var(--good); }
hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
</style>
</head>
<body>
<div id="view"><div id="readout">読み込み中…</div></div>
<div id="side">
  <h1>Mixamo モーション確認</h1>
  <div class="row">
    <label>クリップ</label>
    <select id="clip">
      <option value="assets/motions/fishing-idle.json">Fishing Idle</option>
      <option value="assets/motions/fishing-cast.json">Fishing Cast</option>
    </select>
  </div>
  <div class="row"><button id="play">一時停止</button></div>
  <div class="row">
    <label>フレーム <span id="frameLbl"></span></label>
    <input type="range" id="frame" min="0" max="100" step="1" value="0" />
  </div>
  <div class="row">
    <label>再生速度 <span id="speedLbl">1.00×</span></label>
    <input type="range" id="speed" min="0" max="2" step="0.05" value="1" />
  </div>
  <hr />
  <div class="chk"><input type="checkbox" id="showRod" checked /><label for="showRod" style="margin:0">竿を右手に付ける</label></div>
  <div class="chk"><input type="checkbox" id="leftIK" checked /><label for="leftIK" style="margin:0">左腕を竿へ IK で戻す</label></div>
  <div class="chk"><input type="checkbox" id="showAxes" /><label for="showAxes" style="margin:0">握りの軸を描く</label></div>
  <hr />
  <div class="row">
    <label>右手の握り位置（竿ローカル m）<span id="gripLbl"></span></label>
    <input type="range" id="grip" min="-0.17" max="0.4" step="0.005" value="0.06" />
  </div>
  <div class="row">
    <label>左手の握り位置（竿ローカル m）<span id="leftLbl"></span></label>
    <input type="range" id="left" min="-0.17" max="0.4" step="0.005" value="-0.035" />
  </div>
  <div class="row">
    <label>手のひらの握り点（HandR ローカル -Y m）<span id="palmLbl"></span></label>
    <input type="range" id="palm" min="0" max="0.12" step="0.005" value="0.05" />
  </div>
  <hr />
  <div class="row"><button id="front">正面</button></div>
  <div class="row"><button id="side3">真横</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* 竿の寸法は angler.js と同じ（穂先 2.26 / グリップ尻 -0.17） */
const ROD_TIP_Y = 2.26, ROD_BUTT_Y = -0.17;
/* 竿の軸はクリップが持っている（右手ローカル。Fishing Idle 実測でブレ 0.8 度） */
const ROD_AXIS = new THREE.Vector3(0, 1, 0);
/* 肘の張り出し（angler.js の TUNING.arm.poleL と同じ考え方） */
const POLE_L = new THREE.Vector3(0.5, -0.8, -0.3);
const DOWN = new THREE.Vector3(0, -1, 0);

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d262b);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 60);
camera.position.set(2.2, 1.5, 3.0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0xcfe4ee, 0x2a2f28, 2.0));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -1;
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
scene.add(sun);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x39474a, roughness: 1 })
);
floor.receiveShadow = true;
scene.add(floor);
scene.add(new THREE.GridHelper(8, 16, 0x4a5f68, 0x33444c));

const loader = new GLTFLoader();
const readout = document.getElementById('readout');

/* ---------------- 素体 ---------------- */
const gltf = await loader.loadAsync('./assets/models/player-lowpoly.glb');
const model = gltf.scene;
const bones = {};
model.traverse((o) => {
  bones[o.name] = o;
  if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); }
});
scene.add(model);
const mixer = new THREE.AnimationMixer(model);

/* 腕のリンク長（angler.js と同じ実測） */
model.updateMatrixWorld(true);
const wp = (n) => bones[n].getWorldPosition(new THREE.Vector3());
const armLen = {};
for (const s of ['L', 'R']) {
  const u = wp(`UpperArm${s}`), l = wp(`LowerArm${s}`), w = wp(`Hand${s}`);
  armLen[s] = { upper: u.distanceTo(l), fore: l.distanceTo(w) };
}

/* ---------------- 竿（右手に剛体で付ける） ---------------- */
const rodSrc = await loader.loadAsync('./assets/models/rod-bamboo.glb');
rodSrc.scene.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(rodSrc.scene);
const rs = (ROD_TIP_Y - ROD_BUTT_Y) / Math.max(1e-3, box.max.y - box.min.y);
const ro = ROD_TIP_Y - box.max.y * rs;
const rodMount = new THREE.Object3D();
rodSrc.scene.traverse((n) => {
  if (!n.isMesh) return;
  const geo = n.geometry.clone();
  geo.applyMatrix4(n.matrixWorld);
  geo.scale(rs, rs, rs);
  geo.translate(0, ro, 0);
  const mat = n.material.clone();
  mat.metalness = 0;
  mat.roughness = Math.max(0.55, mat.roughness);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  rodMount.add(mesh);
});
bones.HandR.add(rodMount);

const axesHelper = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 0.6, 0xf5c451, 0.08, 0.05);
rodMount.add(axesHelper);
axesHelper.visible = false;

/* ---------------- 逆運動学（angler.js から） ---------------- */
const _q = new THREE.Quaternion();
const _v = [...Array(8)].map(() => new THREE.Vector3());
function aimBone(bone, dir) {
  bone.parent.updateWorldMatrix(true, false);
  bone.parent.getWorldQuaternion(_q).invert();
  _v[0].copy(dir).applyQuaternion(_q).normalize();
  bone.quaternion.setFromUnitVectors(DOWN, _v[0]);
}
function solveArm(side, target, pole) {
  const upper = bones[`UpperArm${side}`], lower = bones[`LowerArm${side}`];
  const L1 = armLen[side].upper, L2 = armLen[side].fore;
  upper.updateWorldMatrix(true, false);
  upper.getWorldPosition(_v[1]);
  _v[2].subVectors(target, _v[1]);
  const d = Math.min(Math.max(_v[2].length(), Math.abs(L1 - L2) + 0.02), L1 + L2 - 0.008);
  _v[2].normalize();
  const a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  _v[3].copy(pole).addScaledVector(_v[2], -pole.dot(_v[2]));
  if (_v[3].lengthSq() < 1e-8) _v[3].set(0, -1, 0);
  _v[3].normalize();
  const elbow = _v[4].copy(_v[1]).addScaledVector(_v[2], a).addScaledVector(_v[3], h);
  aimBone(upper, _v[5].subVectors(elbow, _v[1]).normalize());
  lower.updateWorldMatrix(true, false);
  lower.getWorldPosition(_v[1]);
  aimBone(lower, _v[5].subVectors(target, _v[1]).normalize());
}

/* ---------------- クリップ ---------------- */
let action = null, clip = null, frames = 0, leftGrip = null;
async function loadClip(url) {
  const json = await (await fetch(url)).json();
  if (action) { action.stop(); mixer.uncacheClip(clip); }
  clip = THREE.AnimationClip.parse(json);
  action = mixer.clipAction(clip);
  action.play();
  frames = json.tracks[0].times.length;
  // 竿の軸と «左手が握っている度合い» はクリップに焼いてある
  ROD_AXIS.fromArray(json.grip.axis).normalize();
  rodMount.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ROD_AXIS);
  leftGrip = json.grip.leftGrip;
  const fr = document.getElementById('frame');
  fr.max = String(frames - 1);
  fr.value = '0';
}
await loadClip(document.getElementById('clip').value);

/* ---------------- UI ---------------- */
const ui = (id) => document.getElementById(id);
let playing = true;
ui('play').onclick = () => { playing = !playing; ui('play').textContent = playing ? '一時停止' : '再生'; };
ui('clip').onchange = (e) => loadClip(e.target.value);
ui('frame').oninput = () => { playing = false; ui('play').textContent = '再生';
  mixer.setTime(Number(ui('frame').value) / 30); };
ui('speed').oninput = () => { ui('speedLbl').textContent = Number(ui('speed').value).toFixed(2) + '×'; };
ui('showRod').onchange = () => { rodMount.visible = ui('showRod').checked; };
ui('showAxes').onchange = () => { axesHelper.visible = ui('showAxes').checked; };
ui('front').onclick = () => { camera.position.set(0, 1.3, 3.2); controls.target.set(0, 1.0, 0); };
ui('side3').onclick = () => { camera.position.set(3.2, 1.3, 0); controls.target.set(0, 1.0, 0); };

/* ---------------- ループ ---------------- */
const clock = new THREE.Clock();
const handTarget = new THREE.Vector3();
const poleWorld = new THREE.Vector3();
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (playing) {
    mixer.update(dt * Number(ui('speed').value));
    ui('frame').value = String(Math.round((mixer.time % clip.duration) * 30));
  }
  ui('frameLbl').textContent = `${ui('frame').value} / ${frames - 1}`;

  const grip = Number(ui('grip').value), leftY = Number(ui('left').value), palm = Number(ui('palm').value);
  ui('gripLbl').textContent = grip.toFixed(3);
  ui('leftLbl').textContent = leftY.toFixed(3);
  ui('palmLbl').textContent = palm.toFixed(3);
  // 竿ローカルの grip が手のひらの握り点へ来るように置く
  rodMount.position.copy(ROD_AXIS).multiplyScalar(-grip).add(new THREE.Vector3(0, -palm, 0));
  model.updateMatrixWorld(true);

  // 左手を竿の leftY へ IK で戻す。ただし «握っている» 区間だけ
  const fi = Math.min(frames - 1, Math.max(0, Math.round(Number(ui('frame').value))));
  const hold = leftGrip ? leftGrip[fi] : 1;
  rodMount.localToWorld(handTarget.set(0, leftY, 0));
  const before = bones.HandL.getWorldPosition(new THREE.Vector3()).distanceTo(handTarget);
  if (ui('leftIK').checked && hold > 0.01) {
    poleWorld.copy(POLE_L).applyQuaternion(model.getWorldQuaternion(_q));
    // 握りが弱いフレームでは、クリップの左手の位置との間を取る
    if (hold < 0.999) {
      handTarget.lerpVectors(bones.HandL.getWorldPosition(new THREE.Vector3()), handTarget, hold);
    }
    solveArm('L', handTarget, poleWorld);
    model.updateMatrixWorld(true);
    // 手も竿の向きへ
    _v[6].set(0, 1, 0).applyQuaternion(rodMount.getWorldQuaternion(_q));
    aimBone(bones.HandL, _v[6]);
    model.updateMatrixWorld(true);
  }
  const after = bones.HandL.getWorldPosition(new THREE.Vector3()).distanceTo(handTarget);

  // 竿のピッチ（垂直から前へ倒した角）
  _v[7].set(0, 1, 0).applyQuaternion(rodMount.getWorldQuaternion(_q));
  const pitch = Math.atan2(Math.hypot(_v[7].x, _v[7].z), _v[7].y) * 180 / Math.PI;
  const cls = after < 0.02 ? 'ok' : 'warn';
  readout.innerHTML =
    `竿のピッチ <b>${pitch.toFixed(1)}°</b>（垂直から前へ）<br>` +
    `左手の竿からのずれ IK 前 <span class="warn">${(before * 100).toFixed(1)}cm</span>` +
    ` → 後 <span class="${cls}">${(after * 100).toFixed(1)}cm</span><br>` +
    `左手の握り <b>${hold.toFixed(2)}</b>`;

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
