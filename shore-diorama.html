<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>渚ディオラマ — 湖畔のフィッシング</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/",
    "postprocessing": "./vendor/postprocessing/index.js"
  }
}
</script>
<style>
:root {
  --bg: #0e1418;
  --panel: rgba(12, 18, 22, 0.82);
  --line: rgba(255, 255, 255, 0.12);
  --fg: #e8eef0;
  --dim: #8fa3ab;
  --gold: #f5c451;
  --accent: #6ec8e8;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 12.5px;
}
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }

#loading {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--dim); letter-spacing: 0.04em;
}
#loading.done { display: none; }

#overlay {
  position: fixed; left: 12px; top: 12px; z-index: 10;
  width: min(360px, calc(100vw - 24px));
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px 12px;
  backdrop-filter: blur(8px);
  line-height: 1.55;
  pointer-events: auto;
}
#overlay h1 {
  margin: 0 0 4px; font-size: 13px; font-weight: 650; color: var(--gold);
}
#overlay .sub { margin: 0 0 8px; color: var(--dim); font-size: 11px; }
#overlay .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
#overlay label { color: var(--dim); font-size: 11px; min-width: 52px; }
#overlay select, #overlay input[type=range] { flex: 1; min-width: 120px; accent-color: var(--gold); }
#overlay button {
  border: 1px solid var(--line); background: rgba(255,255,255,0.06);
  color: var(--fg); border-radius: 999px; padding: 5px 10px;
  font-size: 11.5px; cursor: pointer;
}
#overlay button:hover { border-color: var(--accent); }
#overlay button.on { background: var(--accent); color: #0a1218; border-color: var(--accent); font-weight: 650; }
#readout {
  font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
  color: var(--dim); border-top: 1px solid var(--line); padding-top: 8px;
  white-space: pre-wrap; line-height: 1.65;
}
#hint {
  position: fixed; right: 12px; bottom: 12px; z-index: 10;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; color: var(--dim); font-size: 11px;
  line-height: 1.75; max-width: 280px;
}
</style>
</head>
<body>
<div id="view"></div>
<div id="loading">湖岸を読み込んでいます…</div>

<div id="overlay" hidden>
  <h1>渚ディオラマ</h1>
  <p class="sub">本番 Terrain / Water / Environment / PostFX — 視覚比較用</p>
  <div class="row" id="preset-row"></div>
  <div class="row">
    <label for="clock">時刻</label>
    <input id="clock" type="range" min="0" max="24" step="0.1" value="7.5" />
    <output id="clock-out">07:30</output>
  </div>
  <div class="row">
    <label for="weather">天候</label>
    <select id="weather">
      <option value="clear">晴れ</option>
      <option value="cloudy">くもり</option>
      <option value="rain">雨</option>
    </select>
  </div>
  <div class="row">
    <label for="quality">品質</label>
    <select id="quality">
      <option value="mid">標準</option>
      <option value="high" selected>高品質</option>
    </select>
  </div>
  <div class="row">
    <label><input id="frozen" type="checkbox" /> 時間停止</label>
    <button type="button" id="btn-shot">PNG</button>
    <button type="button" id="btn-reload">再読込</button>
  </div>
  <div id="readout"></div>
</div>

<div id="hint" hidden>
  <b>1/2/3/4</b> カメラ　<b>←/→</b> 立方体を回す　<b>R</b> 自動回転　<b>T/H</b> 時刻 ±　<b>W</b> 天候　<b>Q</b> 品質　<b>F</b> 停止　<b>O</b> UI　<b>P</b> PNG
</div>

<script type="module">
import * as THREE from 'three';
import { Environment, WEATHERS } from './src/sky.js?v=20260828-uwgfx18';
import { Terrain } from './src/terrain.js?v=20260906-leaftex1';
import { resolveLake } from './src/lakefield.js';
import { Water } from './src/water.js?v=20260906-splash1';
import { PostFX } from './src/postfx.js?v=20260828-bloom1';
import { DioramaCube } from './src/dioramaCube.js?v=20260905-cube10';
import { createCausticTexture } from './src/causticTexture.js?v=20260828-caustnet3';

const EXPOSURE = 0.78;
const DEFAULT_SEED = 20240711;
const SHORE_ALONG_OFFSET = 8;
const UP = new THREE.Vector3(0, 1, 0);

const PRESETS = {
  close: {
    id: 'close',
    label: '近距離・汀線',
    eye: { inland: 1.25, along: 0, up: 0.86, lake: -0.80 },
    target: { inland: 0.25, along: 0, up: 0, lake: 5.2 },
    fov: 42,
    // Environment の本番空ドーム（半径 1500m）を遠平面で切らない。
    far: 3000,
  },
  oblique: {
    id: 'oblique',
    label: '斜め・岸',
    eye: { inland: 2.4, along: 1.2, up: 1.85, lake: 1.8 },
    target: { inland: 0.2, along: 0, up: 0, lake: 9.5 },
    fov: 48,
    far: 3000,
  },
  top: {
    id: 'top',
    label: '俯瞰・比較',
    eye: { inland: 1.6, along: 0, up: 11.5, lake: 2.0 },
    target: { inland: 0.5, along: 0, up: 0, lake: 6.0 },
    fov: 36,
    far: 3000,
  },
  /* 立方体に切り取ったジオラマ。カメラは DioramaCube 側が持つので
     eye/target は使わない（applyPreset で分岐する） */
  cube: {
    id: 'cube',
    label: '立方体',
    cube: true,
    fov: 34,
    far: 3000,
  },
};

const params = new URLSearchParams(location.search);
const parseSeed = (raw) => {
  if (raw == null || raw === '') return null;
  const n = Number(raw);
  if (!Number.isFinite(n)) return null;
  return (n >>> 0) || 1;
};
const parseClock = (raw) => {
  if (raw == null || raw === '') return 7.5;
  const n = Number(raw);
  if (!Number.isFinite(n)) return 7.5;
  return ((n % 24) + 24) % 24;
};

const ui = {
  loading: document.getElementById('loading'),
  overlay: document.getElementById('overlay'),
  hint: document.getElementById('hint'),
  presetRow: document.getElementById('preset-row'),
  clock: document.getElementById('clock'),
  clockOut: document.getElementById('clock-out'),
  weather: document.getElementById('weather'),
  quality: document.getElementById('quality'),
  frozen: document.getElementById('frozen'),
  readout: document.getElementById('readout'),
  btnShot: document.getElementById('btn-shot'),
  btnReload: document.getElementById('btn-reload'),
};

const state = {
  seed: parseSeed(params.get('seed')) ?? DEFAULT_SEED,
  preset: params.get('preset') in PRESETS ? params.get('preset') : 'close',
  clock: parseClock(params.get('clock')),
  weather: params.get('weather') in WEATHERS ? params.get('weather') : 'clear',
  quality: params.get('quality') === 'mid' ? 'mid' : 'high',
  frozen: params.get('frozen') === '1',
  simTime: 0,
};

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({
  antialias: state.quality === 'high',
  powerPreference: 'high-performance',
  // この開発ページの PNG ボタン用。本番 Game の描画設定は変更しない。
  preserveDrawingBuffer: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, state.quality === 'high' ? 2 : 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = EXPOSURE;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, 1, 0.08, 340);
camera.position.set(0, 2, 0);

let env = null;
let terrain = null;
let water = null;
let postfx = null;
let lake = null;
let lakeStats = null;
let shoreFocus = null;
let cube = null;
let ready = false;

function fmtClock(h) {
  const t = ((h % 24) + 24) % 24;
  const hh = String(Math.floor(t)).padStart(2, '0');
  const mm = String(Math.round((t % 1) * 60)).padStart(2, '0');
  return `${hh}:${mm}`;
}

function makeCausticsUniforms() {
  return {
    uCaustTex: { value: createCausticTexture() },
    uCaustScale: { value: new THREE.Vector2(0.105, 0.166) },
    uCaustShape: { value: new THREE.Vector2(1.0, 1.4) },
    uCaustRange: { value: new THREE.Vector2(1.3, 0.22) },
    uCaustDepth: { value: new THREE.Vector2(0.07, 0.60) },
    uCaustDist: { value: new THREE.Vector2(28.0, 60.0) },
    uCaustFar: { value: new THREE.Vector2(6.0, 20.0) },
    uCaustWarp: { value: new THREE.Vector2(1.15, 2.5) },
    uCaustMag: { value: 0.18 },
    uCaustMixW: { value: new THREE.Vector3(1.0, 0.5, 0.0) },
    uCaustTime: { value: 0 },
    uCaustSunDir: { value: new THREE.Vector3(0, 1, 0) },
    uCaustNight: { value: 0 },
    uCaustRain: { value: 0 },
    uCaustCloud: { value: 0 },
    uCaustStrength: { value: 0 },
  };
}

/** 本番 lake.dock から、検証済み岸線上の焦点を決める（第二地形は作らない） */
function computeShoreFocus(resolvedLake, terr) {
  const d = resolvedLake.dock;
  const lakeDir = new THREE.Vector3(d.dir.x, 0, d.dir.z).normalize();
  const inland = lakeDir.clone().negate();
  const alongShore = new THREE.Vector3(-lakeDir.z, 0, lakeDir.x).normalize();
  // dock.start は岸から 3.5m 陸側なので、そのまま横へずらすと
  // 入り江の曲率ぶんだけ岸から外れる。実際の本番 heightAt を使って
  // 同じ法線方向に水際を二分探索し、別の地形や近似線を作らない。
  const probe = new THREE.Vector3(
    d.start.x + alongShore.x * SHORE_ALONG_OFFSET,
    0,
    d.start.z + alongShore.z * SHORE_ALONG_OFFSET,
  );
  let lo = 0;
  let hi = 1;
  let hHi = terr.heightAt(probe.x + lakeDir.x * hi, probe.z + lakeDir.z * hi);
  while (hHi > 0 && hi < 128) {
    lo = hi;
    hi *= 2;
    hHi = terr.heightAt(probe.x + lakeDir.x * hi, probe.z + lakeDir.z * hi);
  }
  if (hHi > 0) {
    // 検証済みの湖で通常は起きないが、別 seed でも UI を壊さず
    // dock.start 側へ戻す。
    hi = 0;
  } else {
    for (let i = 0; i < 28; i++) {
      const mid = (lo + hi) * 0.5;
      const h = terr.heightAt(probe.x + lakeDir.x * mid, probe.z + lakeDir.z * mid);
      if (h > 0) lo = mid;
      else hi = mid;
    }
  }
  const shore = probe.clone().addScaledVector(lakeDir, hi);
  const land = shore.clone().addScaledVector(lakeDir, -0.65);
  land.y = terr.heightAt(land.x, land.z);
  return {
    land,
    shore,
    lakeDir,
    inland,
    alongShore,
    dockStart: new THREE.Vector3(d.start.x, terr.heightAt(d.start.x, d.start.z), d.start.z),
    dockEnd: terr.dockEnd.clone(),
    shoreR0: d.r0,
    shoreDist: hi,
    alongOffset: SHORE_ALONG_OFFSET,
  };
}

function offsetFromFocus(focus, spec, waterSurfY) {
  const p = new THREE.Vector3()
    .copy(focus.land)
    .addScaledVector(focus.inland, spec.inland)
    .addScaledVector(focus.alongShore, spec.along)
    .addScaledVector(UP, spec.up)
    .addScaledVector(focus.lakeDir, spec.lake);
  if (spec.up <= 0.05) p.y = waterSurfY;
  return p;
}

function applyPreset(id) {
  const preset = PRESETS[id];
  if (!preset || !shoreFocus || !water || !terrain) return;
  state.preset = id;
  if (preset.cube) {
    cube.enable(renderer);
    cube.applyCamera(camera);
    syncPresetButtons();
    updateReadout();
    return;
  }
  cube?.disable();
  const target = offsetFromFocus(shoreFocus, preset.target, water.surfaceY(0, 0));
  target.y = water.surfaceY(target.x, target.z);
  const eyePos = offsetFromFocus(shoreFocus, preset.eye, 0);
  const groundY = terrain.heightAt(eyePos.x, eyePos.z);
  eyePos.y = Math.max(eyePos.y, groundY + 0.18);
  camera.position.copy(eyePos);
  camera.lookAt(target);
  camera.fov = preset.fov;
  camera.near = 0.08;
  camera.far = preset.far;
  camera.updateProjectionMatrix();
  syncPresetButtons();
  updateReadout();
}

function syncPresetButtons() {
  for (const btn of ui.presetRow.querySelectorAll('button')) {
    btn.classList.toggle('on', btn.dataset.preset === state.preset);
  }
}

function setHudVisible(visible) {
  ui.overlay.hidden = !visible;
  ui.hint.hidden = !visible;
}

function updateReadout() {
  if (!shoreFocus) return;
  const p = camera.position;
  if (cube?.enabled) {
    ui.readout.textContent = [
      `seed ${state.seed}  preset ${state.preset}  品質 ${state.quality}`,
      `岸焦点 (${shoreFocus.shore.x.toFixed(1)}, ${shoreFocus.shore.z.toFixed(1)})`,
      cube.describe(),
      `カメラ (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`,
      `時刻 ${fmtClock(state.clock)}  天候 ${WEATHERS[state.weather]?.name || state.weather}`,
      `simTime ${state.simTime.toFixed(2)}s  frozen ${state.frozen ? 'on' : 'off'}`,
    ].join('\n');
    return;
  }
  const t = offsetFromFocus(shoreFocus, PRESETS[state.preset].target, water.surfaceY(0, 0));
  t.y = water.surfaceY(t.x, t.z);
  ui.readout.textContent = [
    `seed ${state.seed}  preset ${state.preset}  品質 ${state.quality}`,
    `岸焦点 (${shoreFocus.shore.x.toFixed(1)}, ${shoreFocus.shore.z.toFixed(1)})  岸距離 ${shoreFocus.shoreDist.toFixed(1)}m`,
    `カメラ (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}) → (${t.x.toFixed(1)}, ${t.y.toFixed(2)}, ${t.z.toFixed(1)})`,
    `時刻 ${fmtClock(state.clock)}  天候 ${WEATHERS[state.weather]?.name || state.weather}`,
    `simTime ${state.simTime.toFixed(2)}s  frozen ${state.frozen ? 'on' : 'off'}`,
  ].join('\n');
}

function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set('seed', String(state.seed >>> 0));
  u.searchParams.set('preset', state.preset);
  u.searchParams.set('clock', String(state.clock));
  u.searchParams.set('weather', state.weather);
  u.searchParams.set('quality', state.quality);
  u.searchParams.set('frozen', state.frozen ? '1' : '0');
  history.replaceState(null, '', u);
}

function resize() {
  const w = view.clientWidth;
  const h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  postfx?.setSize(w, h);
}

function fillUnderwaterOptics(ctx) {
  ctx.turbidity = 1 + env.rainIntensity * 0.5 + env.cloudiness * 0.12;
}

function renderFrame(dt) {
  if (!ready) return;
  const sdt = state.frozen ? 0 : dt;
  if (!state.frozen) state.simTime += sdt;

  env.update(sdt, state.clock, camera, shoreFocus.land);
  const windPow = 1 + env.rainIntensity * 0.9 + env.cloudiness * 0.2;
  terrain.updateWind(state.simTime, windPow);
  terrain.updateTrees(dt, camera.position);
  terrain.updateLamp(env.nightAmount, sdt);
  water.update(sdt, camera, env);
  const flowStrength = 0.035 + water.wind * 0.018;
  terrain.updateUnderwaterProps(state.simTime, camera, terrain.dockDir, flowStrength);
  terrain.updateShore(water.time, water.wind);
  if (cube?.enabled) {
    cube.update(state.frozen ? 0 : dt);
    cube.applyCamera(camera);
  }

  const uwPropGroup = terrain.underwaterProps?.group;
  const uwPropWasVisible = uwPropGroup?.visible;
  try {
    water.capture(renderer, scene, camera);
    if (uwPropGroup) uwPropGroup.visible = false;
    water.captureReflection(renderer, scene, camera);
    const uwCtx = water.getUnderwaterContext(camera);
    uwCtx.cloud = env.cloudiness;
    fillUnderwaterOptics(uwCtx);
    if (uwPropGroup) uwPropGroup.visible = !!uwPropWasVisible && uwCtx.strength > 0.05;
    postfx.updateUnderwater(uwCtx);
    postfx.render(sdt);
  } finally {
    if (uwPropGroup) uwPropGroup.visible = uwPropWasVisible;
  }
  updateReadout();
}

async function build() {
  env = new Environment(scene, { exposure: EXPOSURE });
  env.setQuality(state.quality);
  env.setWeather(state.weather);

  const resolved = resolveLake(state.seed);
  lake = resolved.lake;
  lakeStats = resolved.stats;
  state.seed = resolved.seed;

  let bedTextures = null;
  let dockTextures = null;
  let landTextures = null;
  let leafTextures = null;
  const texResults = await Promise.allSettled([
    Terrain.loadBedTextures(),
    Terrain.loadDockTextures(),
    Terrain.loadLandTextures(),
    Terrain.loadLeafTextures(),
  ]);
  if (texResults[0].status === 'fulfilled') bedTextures = texResults[0].value;
  if (texResults[1].status === 'fulfilled') dockTextures = texResults[1].value;
  if (texResults[2].status === 'fulfilled') landTextures = texResults[2].value;
  if (texResults[3].status === 'fulfilled') leafTextures = texResults[3].value;

  const causticsUniforms = makeCausticsUniforms();
  terrain = new Terrain(scene, {
    quality: state.quality,
    lake,
    bedTextures,
    dockTextures,
    landTextures,
    leafTextures,
    causticsUniforms,
    renderer,
  });
  shoreFocus = computeShoreFocus(lake, terrain);

  water = new Water(scene, terrain, {
    quality: state.quality,
    exposure: EXPOSURE,
    causticsUniforms,
    skyUniforms: env.skyUniforms,
  });

  postfx = new PostFX(renderer, scene, camera, {
    quality: state.quality,
    water,
    sky: env.skyUniforms,
    exposure: EXPOSURE,
  });

  cube = new DioramaCube(scene, terrain, water, { exclude: [env.sky] });
  cube.setFocus(shoreFocus);

  /* 水柱は «水面から下» を横から見せる面なので、水面の屈折・映り込みへ
     入れると水の色が二重にかかる。地層の壁は «水の向こうにある物» なので残す */
  water.setCaptureHidden([env.sky, env.rain, ...cube.captureHidden,
    ...(terrain.overWaterProps || [])]);
  water.setReflectionHidden([
    env.rain,
    ...cube.captureHidden,
    terrain.underwaterProps?.group,
    ...(terrain.waterPlants?.submergedMeshes || []),
  ]);

  applyPreset(state.preset);
  resize();
}

function buildPresetButtons() {
  ui.presetRow.innerHTML = '';
  for (const preset of Object.values(PRESETS)) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.preset = preset.id;
    btn.textContent = preset.label;
    btn.addEventListener('click', () => {
      applyPreset(preset.id);
      syncUrl();
    });
    ui.presetRow.appendChild(btn);
  }
}

function bindUi() {
  buildPresetButtons();
  ui.clock.value = String(state.clock);
  ui.clockOut.textContent = fmtClock(state.clock);
  ui.weather.value = state.weather;
  ui.quality.value = state.quality;
  ui.frozen.checked = state.frozen;

  ui.clock.addEventListener('input', () => {
    state.clock = Number(ui.clock.value);
    ui.clockOut.textContent = fmtClock(state.clock);
    syncUrl();
    updateReadout();
  });
  ui.weather.addEventListener('change', () => {
    state.weather = ui.weather.value;
    env?.setWeather(state.weather);
    syncUrl();
    updateReadout();
  });
  ui.quality.addEventListener('change', () => {
    state.quality = ui.quality.value;
    env?.setQuality(state.quality);
    terrain?.setQuality(state.quality);
    water?.setQuality?.(state.quality);
    postfx?.setQuality(state.quality);
    cube?.refreshClipping();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, state.quality === 'high' ? 2 : 1.5));
    syncUrl();
    updateReadout();
  });
  ui.frozen.addEventListener('change', () => {
    state.frozen = ui.frozen.checked;
    syncUrl();
    updateReadout();
  });
  ui.btnReload.addEventListener('click', () => location.reload());
  ui.btnShot.addEventListener('click', () => api.capturePNG());

  window.addEventListener('keydown', (ev) => {
    if (ev.target.matches('input, select, textarea')) return;
    if (ev.key === '1') { applyPreset('close'); syncUrl(); }
    else if (ev.key === '2') { applyPreset('oblique'); syncUrl(); }
    else if (ev.key === '3') { applyPreset('top'); syncUrl(); }
    else if (ev.key === '4') { applyPreset('cube'); syncUrl(); }
    else if (cube?.enabled && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
      ev.preventDefault();
      cube.autoOrbit = false;
      cube.orbit += (ev.key === 'ArrowLeft' ? -1 : 1) * (ev.shiftKey ? 0.02 : 0.09);
    }
    else if (cube?.enabled && (ev.key === 'r' || ev.key === 'R')) cube.autoOrbit = !cube.autoOrbit;
    else if (ev.key === 't' || ev.key === 'T') { state.clock = (state.clock + 0.5) % 24; ui.clock.value = String(state.clock); ui.clockOut.textContent = fmtClock(state.clock); syncUrl(); }
    else if (ev.key === 'h' || ev.key === 'H') { state.clock = (state.clock + 23.5) % 24; ui.clock.value = String(state.clock); ui.clockOut.textContent = fmtClock(state.clock); syncUrl(); }
    else if (ev.key === 'w' || ev.key === 'W') {
      const keys = Object.keys(WEATHERS);
      const i = (keys.indexOf(state.weather) + 1) % keys.length;
      state.weather = keys[i];
      ui.weather.value = state.weather;
      env?.setWeather(state.weather);
      syncUrl();
    } else if (ev.key === 'q' || ev.key === 'Q') {
      state.quality = state.quality === 'high' ? 'mid' : 'high';
      ui.quality.value = state.quality;
      ui.quality.dispatchEvent(new Event('change'));
    } else if (ev.key === 'f' || ev.key === 'F') {
      state.frozen = !state.frozen;
      ui.frozen.checked = state.frozen;
      syncUrl();
    } else if (ev.key === 'o' || ev.key === 'O') {
      setHudVisible(ui.overlay.hidden);
    } else if (ev.key === 'p' || ev.key === 'P') api.capturePNG();
  });
}

const waitReady = () => new Promise((resolve, reject) => {
  if (ready) { resolve(api); return; }
  const t0 = performance.now();
  const poll = () => {
    if (ready) { resolve(api); return; }
    if (performance.now() - t0 > 180000) {
      reject(new Error('shore diorama load timeout'));
      return;
    }
    requestAnimationFrame(poll);
  };
  poll();
});

const api = {
  get ready() { return ready; },
  get seed() { return state.seed; },
  get lake() { return lake; },
  get stats() { return lakeStats; },
  get shoreFocus() { return shoreFocus; },
  get cube() { return cube; },
  get terrain() { return terrain; },
  get water() { return water; },
  get env() { return env; },
  get postfx() { return postfx; },
  get renderer() { return renderer; },
  get scene() { return scene; },
  get camera() { return camera; },
  get state() { return { ...state }; },
  presets: Object.keys(PRESETS),
  waitReady,
  setPreset(id) { applyPreset(id); syncUrl(); },
  setClock(h) {
    state.clock = ((Number(h) % 24) + 24) % 24;
    ui.clock.value = String(state.clock);
    ui.clockOut.textContent = fmtClock(state.clock);
    syncUrl();
    updateReadout();
  },
  setWeather(key) {
    if (!WEATHERS[key]) return;
    state.weather = key;
    ui.weather.value = key;
    env?.setWeather(key);
    syncUrl();
    updateReadout();
  },
  setQuality(q) {
    if (q !== 'mid' && q !== 'high') return;
    state.quality = q;
    ui.quality.value = q;
    ui.quality.dispatchEvent(new Event('change'));
  },
  setFrozen(on) {
    state.frozen = !!on;
    ui.frozen.checked = state.frozen;
    syncUrl();
    updateReadout();
  },
  setHudVisible,
  setSeed(n) {
    const u = new URL(location.href);
    u.searchParams.set('seed', String((Number(n) >>> 0) || 1));
    location.href = u.toString();
  },
  tick(dt = 1 / 60) { renderFrame(dt); },
  renderOnce() { renderFrame(0); },
  capturePNG(filename) {
    renderFrame(0);
    const name = filename || `shore-diorama-${state.preset}-seed${state.seed}.png`;
    renderer.domElement.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  },
  getSnapshot() {
    return {
      seed: state.seed,
      preset: state.preset,
      clock: state.clock,
      weather: state.weather,
      quality: state.quality,
      frozen: state.frozen,
      simTime: state.simTime,
      shore: shoreFocus ? {
        x: shoreFocus.land.x,
        y: shoreFocus.land.y,
        z: shoreFocus.land.z,
        shoreR0: shoreFocus.shoreR0,
      } : null,
      camera: {
        x: camera.position.x,
        y: camera.position.y,
        z: camera.position.z,
        fov: camera.fov,
        far: camera.far,
      },
    };
  },
};

window.__shoreDiorama = api;

bindUi();
window.addEventListener('resize', resize);

(async () => {
  try {
    await build();
    ready = true;
    ui.loading.classList.add('done');
    ui.overlay.hidden = false;
    ui.hint.hidden = false;
    syncUrl();
    syncPresetButtons();
    updateReadout();
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      renderFrame(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  } catch (err) {
    console.error(err);
    ui.loading.textContent = `読み込みに失敗しました: ${err.message}`;
  }
})();
</script>
</body>
